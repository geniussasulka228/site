<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord сервер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e14;
            background-image: radial-gradient(circle at 20% 30%, #1a1f2e, #0b0e14 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.15), transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .glow-orb2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 255, 200, 0.08), transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 780px;
            width: 100%;
            background: rgba(26, 31, 46, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 45px 35px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #5865f2;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.3);
            margin-bottom: 18px;
            transition: 0.3s;
        }
        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(88, 101, 242, 0.6);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a0b4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .sub {
            font-size: 1rem;
            color: #99aab5;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 14px 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.3s;
        }
        .stat-item:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-3px);
        }
        .stat-item .number {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
        }
        .stat-item .label {
            font-size: 0.75rem;
            color: #99aab5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .stat-item .label i {
            margin-right: 6px;
            color: #5865f2;
        }

        .widget-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .widget-wrapper iframe {
            width: 100%;
            height: 360px;
            border: none;
            display: block;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #5865f2, #4752c4);
            color: #fff;
            padding: 16px 44px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 32px rgba(88, 101, 242, 0.5);
        }

        .footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #5c6977;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 22px;
        }
        .footer i {
            color: #5865f2;
        }

        @media (max-width: 640px) {
            .card { padding: 30px 18px; }
            h1 { font-size: 2.2rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stats-grid .stat-item:last-child { grid-column: span 2; }
            .widget-wrapper iframe { height: 280px; }
            .btn-primary { width: 100%; justify-content: center; }
        }
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr; }
            .stats-grid .stat-item:last-child { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb2"></div>

    <div class="card">
        <!-- Аватарка: заменяем на свою картинку или используем заглушку -->
        <img src="https://cdn.discordapp.com/attachments/1528921575330549892/1532347534511706263/d_9fda9dd3-1.png?ex=6a6c8559&is=6a6b33d9&hm=8218f3434307c3dc72cb6dc587fb7c431256f39cd37679c85b3c4f6852dcdc8c&" alt="Лого" class="avatar" onerror="this.src='https://via.placeholder.com/110/5865f2/FFFFFF?text=?'">

        <h1>Название сервера</h1>
        <p class="sub">Добро пожаловать в наше сообщество</p>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="number"><span id="online-count">0</span></div>
                <div class="label"><i class="fas fa-user"></i> Онлайн</div>
            </div>
            <div class="stat-item">
                <div class="number"><span id="game-count">0</span></div>
                <div class="label"><i class="fas fa-gamepad"></i> Играют</div>
            </div>
            <div class="stat-item">
                <div class="number"><span id="member-count">0</span></div>
                <div class="label"><i class="fas fa-users"></i> Участников</div>
            </div>
        </div>

        <div class="widget-wrapper">
            <iframe src="https://discord.com/widget?id=1528921571459334255&theme=dark" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
        </div>

        <a href="https://discord.gg/FFyxYAkk5M" target="_blank" class="btn-primary">
            <i class="fab fa-discord"></i> Присоединиться
        </a>

        <div class="footer">
            © 2026 · Сделано с <i class="fas fa-heart"></i>
        </div>
    </div>

    <script>
        const GUILD_ID = '1528921571459334255';

        async function updateStats() {
            try {
                const res = await fetch(`https://discord.com/api/v10/guilds/${GUILD_ID}/widget.json`);
                if (!res.ok) throw new Error();
                const data = await res.json();

                const online = data.presence_count || 0;
                document.getElementById('online-count').textContent = online;

                const games = new Set();
                if (data.members) {
                    data.members.forEach(m => {
                        if (m.game && m.game.name) games.add(m.game.name);
                    });
                }
                document.getElementById('game-count').textContent = games.size || 0;

                // Общее число участников – замени на реальное (или оставь)
                const totalMembers = 30;
                document.getElementById('member-count').textContent = totalMembers;

            } catch (e) {
                console.warn('Статистика не загружена');
            }
        }

        updateStats();
        setInterval(updateStats, 30000);
    </script>
</body>
</html>
